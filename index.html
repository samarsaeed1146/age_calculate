<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images/age_icon.jpeg" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f0f5ff",
                100: "#e0ebff",
                500: "#6366f1",
                600: "#4f46e5",
                700: "#4338ca",
              },
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-calendar-picker-indicator {
        filter: invert(0.8) sepia(1) saturate(5) hue-rotate(190deg);
        cursor: pointer;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased relative overflow-x-hidden"
  >
    <div
      class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-125 h-125 bg-indigo-600/20 blur-[120px] rounded-full pointer-events-none"
    ></div>
    <div
      class="absolute bottom-1/4 left-1/2 -translate-x-1/2 translate-y-1/2 w-100 h-100 bg-sky-500/15 blur-[100px] rounded-full pointer-events-none"
    ></div>

    <main
      class="relative z-10 w-full max-w-lg bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-8 sm:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] ring-1 ring-white/10 space-y-8"
    >
      <div class="text-center space-y-3">
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold tracking-wide uppercase"
        >
          <span
            class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"
          ></span>
          Utility Tool
        </div>

        <h2 class="text-3xl sm:text-4xl font-black tracking-tight text-white">
          Age
          <span
            class="bg-linear-to-r from-indigo-400 via-sky-400 to-emerald-400 bg-clip-text text-transparent"
            >Calculator</span
          >
        </h2>
        <p class="text-xs sm:text-sm text-slate-400 max-w-xs mx-auto">
          Enter your date of birth to calculate your precise breakdown in years,
          months, and days.
        </p>
      </div>
      <div class="space-y-6">
        <div class="space-y-2">
          <label
            for="calendar"
            class="block text-xs font-semibold text-slate-300 uppercase tracking-wider pl-1"
          >
            Date of Birth
          </label>
          <div class="relative">
            <input
              type="date"
              id="calendar"
              class="w-full px-4 py-3.5 bg-slate-950/70 border border-slate-700/80 rounded-2xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/15 transition-all duration-300 shadow-inner"
            />
          </div>
        </div>

        <button
          onclick="calculateAge()"
          class="group relative w-full py-4 px-6 bg-linear-to-r from-indigo-600 via-indigo-500 to-sky-500 hover:from-indigo-500 hover:to-sky-400 text-white font-bold text-sm tracking-wide rounded-2xl shadow-[0_0_25px_rgba(99,102,241,0.3)] hover:shadow-[0_0_35px_rgba(99,102,241,0.5)] focus:outline-none focus:ring-4 focus:ring-indigo-500/30 transition-all duration-300 active:scale-[0.98]"
        >
          <span class="relative z-10 flex items-center justify-center gap-2">
            Calculate Age
            <svg
              class="w-4 h-4 group-hover:translate-x-1 transition-transform duration-200"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              />
            </svg>
          </span>
        </button>
      </div>

      <!-- Result Card -->
      <div class="pt-2">
        <div
          class="bg-slate-950/50 border border-slate-800/80 rounded-2xl p-5 shadow-inner transition-all duration-300 min-h-16 flex items-center justify-center text-center"
        >
          <p
            id="result"
            class="text-sm font-semibold tracking-wide text-indigo-200 leading-relaxed"
          ></p>
        </div>
      </div>
    </main>

    <script>
      function calculateAge() {
        const input = document.getElementById("calendar").value;
        const result = document.getElementById("result");

        if (!input) {
          result.innerText = "Please select your date of birth.";
          return;
        }

        const [year, month, day] = input.split("-").map(Number);
        const birthDate = new Date(year, month - 1, day);
        const currentDate = new Date();

        if (birthDate > currentDate) {
          result.innerText = "Date of birth cannot be in the future.";
          return;
        }

        let years = currentDate.getFullYear() - birthDate.getFullYear();
        let months = currentDate.getMonth() - birthDate.getMonth();
        let days = currentDate.getDate() - birthDate.getDate();

        if (days < 0) {
          months--;

          const previousMonthDays = new Date(
            currentDate.getFullYear(),
            currentDate.getMonth(),
            0,
          ).getDate();

          days += previousMonthDays;
        }
        if (months < 0) {
          years--;
          months += 12;
        }

        result.innerText =
          "Your age is: " +
          years +
          " years, " +
          months +
          " months, and " +
          days +
          " days.";
      }
    </script>
  </body>
</html>
